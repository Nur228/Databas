services:
  db:
    image: postgres:16
    container_name: airport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/labs:ro   # папка репозитория видна внутри контейнера как /labs

volumes:
  pgdata:
